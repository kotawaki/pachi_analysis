<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10 実戦ログ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#c9d1d9;font-family:"Segoe UI",Meiryo,sans-serif}main{max-width:720px;margin:auto;padding:14px 12px 40px}h1{font-size:24px;margin:4px 0;color:#58a6ff}h2{font-size:17px;margin:0 0 10px;color:#f0f6fc}.sub,.note{color:#8b949e;font-size:12px;line-height:1.6}.panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:#8b949e;display:block}input,select,button{font:inherit;border-radius:9px;border:1px solid #30363d;background:#0d1117;color:#f0f6fc}input,select{width:100%;padding:12px;margin-top:5px;font-size:18px}button{min-height:48px;padding:10px 12px;font-weight:700;touch-action:manipulation}.primary{width:100%;background:#238636;border-color:#2ea043;margin-top:12px}.muted{background:#21262d}.danger{background:#6e1b1b;border-color:#a33}.hit{background:#b62324;border-color:#f85149;min-height:62px;font-size:18px}.actions,.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.actions button{min-height:54px}.row{display:flex;align-items:center;gap:10px}.row input[type=checkbox]{width:22px;height:22px;margin:0}.status{min-height:22px;color:#3fb950;font-size:13px;margin-top:8px}.error{color:#f85149}.hidden{display:none!important}.session-head{display:flex;justify-content:space-between;align-items:center}.machine{font-size:20px;font-weight:800;color:#f0f6fc}.log{display:grid;gap:8px}.event{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;border-top:1px solid #30363d;padding-top:9px}.event:first-child{border-top:0}.time{color:#8b949e}.event-name{font-weight:700}.event-meta{font-size:12px;color:#8b949e}.event-actions{display:flex;gap:5px}.event-actions button{min-height:36px;padding:5px 8px;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal>div{width:min(720px,100%);background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}@media(min-width:600px){main{padding-top:28px}.actions{grid-template-columns:repeat(4,1fr)}.hit{grid-column:span 2}}
</style>
</head>
<body><main>
<h1>10 実戦ログ</h1><p class="sub">現場観察専用。prediction / Wave / Weak MAへは書き戻しません。</p>
<section id="setup" class="panel"><h2>実戦開始</h2><div class="grid"><label>日付<input id="date" type="date"></label><label>台番号<input id="machine" inputmode="numeric" maxlength="4" placeholder="043"></label></div><label style="margin-top:10px">打ち始め回転数<input id="startSpins" inputmode="numeric" type="number" min="0" placeholder="128"></label><button id="start" class="primary">実戦開始</button><div id="setupStatus" class="status"></div></section>
<section id="active" class="hidden"><div class="panel"><div class="session-head"><div><div id="activeDate" class="sub"></div><div id="activeMachine" class="machine"></div></div><button id="end" class="muted">終了</button></div><label style="margin-top:14px">現在回転数<input id="spins" inputmode="numeric" type="number" min="0" placeholder="現在の回転数"></label><div class="row" style="margin-top:10px"><input id="jitan" type="checkbox"><label for="jitan">時短中（初当たりに付加）</label></div><div class="actions" style="margin-top:12px"><button data-action="チャンス目">チャンス目</button><button data-action="ブーン">ブーン</button><button data-action="SIGMA目">SIGMA目</button><button data-action="その他">その他</button><button data-action="初当たり" class="hit">初当たり</button></div><div id="more" class="hidden"><div class="choice-grid"><button data-action="チャンス目1">チャンス目1</button><button data-action="チャンス目2">チャンス目2</button><button data-action="チャンス目3">チャンス目3</button><button data-action="リーチチャンス目">リーチチャンス目</button><button data-action="339">339</button><button data-action="441">441</button><button data-action="774">774</button><button data-action="枠外999">枠外999</button><button data-action="枠外ハズレ">枠外ハズレ</button><button data-action="ブーン">ブーン</button></div><div class="row" style="margin-top:9px"><input id="freeText" placeholder="自由入力" maxlength="80"><button id="freeSave" class="muted">自由入力を保存</button></div></div><div id="saveStatus" class="status"></div></div><div class="panel"><h2>時系列ログ</h2><div id="log" class="log"></div></div></section>
<section class="panel"><p class="note">起動: <code>python tools/practice_log_server.py --host 0.0.0.0</code><br>スマホ: <code>http://PCのIP:8777/practice_log/</code><br>保存先: <code>data/local_practice_log/</code></p></section>
</main>
<div id="editModal" class="modal hidden"><div><h2>ログを訂正</h2><label>回転数<input id="editSpins" inputmode="numeric" type="number" min="0"></label><label style="margin-top:8px">アクション<select id="editName"></select></label><div class="row" style="margin-top:10px"><input id="editJitan" type="checkbox"><label for="editJitan">時短中</label></div><label style="margin-top:8px">メモ<input id="editMemo" maxlength="80"></label><div class="modal-actions"><button id="editCancel" class="muted">キャンセル</button><button id="editSave" class="primary">保存</button></div></div></div>
<script>
const ACTIONS=['チャンス目','ブーン','SIGMA目','チャンス目1','チャンス目2','チャンス目3','リーチチャンス目','339','441','774','枠外999','枠外ハズレ','初当たり'];let session=null,editing=null;const $=id=>document.getElementById(id);const localDate=()=>new Date().toLocaleDateString('sv-SE');
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json();if(!r.ok)throw Error(j.error||'保存に失敗しました');return j}
function status(id,t,bad=false){$(id).textContent=t;$(id).className='status'+(bad?' error':'')}
function show(s){session=s;$('setup').classList.add('hidden');$('active').classList.remove('hidden');$('activeDate').textContent=s.date;$('activeMachine').textContent=s.machine+'番台・実戦中';localStorage.setItem('practice_log_session',s.session_id);render()}
function render(){const box=$('log');box.innerHTML='';if(!session.events.length){box.innerHTML='<div class="note">まだログはありません。</div>';return}session.events.forEach(e=>{const d=new Date(e.timestamp),t=isNaN(d)?e.timestamp.slice(11,16):d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),row=document.createElement('div');row.className='event';row.innerHTML='<div class="time">'+t+'</div><div><div class="event-name"></div><div class="event-meta">'+e.spins+'回転'+(e.during_jitan?' · 時短中':'')+(e.memo?' · '+e.memo:'')+'</div></div><div class="event-actions"><button class="muted edit">訂正</button><button class="danger del">削除</button></div>';row.querySelector('.event-name').textContent=e.event_name;row.querySelector('.edit').onclick=()=>openEdit(e);row.querySelector('.del').onclick=()=>removeEvent(e);box.appendChild(row)})}
async function start(){try{const date=$('date').value,machine=$('machine').value.trim(),spins=$('startSpins').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{3,4}$/.test(machine)||spins==='')throw Error('日付・3桁台番号・打ち始め回転数を入力してください');show((await api('/api/practice-log/session',{method:'POST',body:JSON.stringify({date,machine,start_spins:Number(spins)})})).session)}catch(e){status('setupStatus',e.message,true)}}
async function addEvent(name){try{if($('spins').value==='')throw Error('現在回転数を入力してください');const j=await api('/api/practice-log/event',{method:'POST',body:JSON.stringify({session_id:session.session_id,spins:Number($('spins').value),event_name:name,event_type:name==='初当たり'?'FIRST_HIT':'ACTION',during_jitan:name==='初当たり'&&$('jitan').checked})});session.events.push(j.event);render();status('saveStatus','保存しました');$('spins').focus()}catch(e){status('saveStatus',e.message,true)}}
async function removeEvent(e){if(!confirm('このログを削除しますか？'))return;await api('/api/practice-log/event/'+e.event_id,{method:'DELETE'});session.events=session.events.filter(x=>x.event_id!==e.event_id);render()}
function openEdit(e){editing=e;$('editSpins').value=e.spins;$('editName').innerHTML=ACTIONS.map(x=>'<option>'+x+'</option>').join('');$('editName').value=e.event_name;$('editJitan').checked=e.during_jitan;$('editMemo').value=e.memo||'';$('editModal').classList.remove('hidden')}
$('editCancel').onclick=()=> $('editModal').classList.add('hidden');$('editSave').onclick=async()=>{try{const j=await api('/api/practice-log/event/'+editing.event_id,{method:'PATCH',body:JSON.stringify({spins:Number($('editSpins').value),event_name:$('editName').value,during_jitan:$('editJitan').checked,memo:$('editMemo').value})});Object.assign(editing,j.event);$('editModal').classList.add('hidden');render()}catch(e){alert(e.message)}};$('start').onclick=start;$('end').onclick=()=>{session=null;localStorage.removeItem('practice_log_session');$('active').classList.add('hidden');$('setup').classList.remove('hidden')};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='その他'?$('more').classList.toggle('hidden'):addEvent(b.dataset.action));$('freeSave').onclick=()=>{const v=$('freeText').value.trim();if(v){addEvent(v);$('freeText').value=''}};
(async()=>{$('date').value=localDate();try{const j=await api('/api/practice-log?date='+encodeURIComponent($('date').value));const s=j.sessions.find(x=>x.session_id===localStorage.getItem('practice_log_session'));if(s)show(s)}catch(e){status('setupStatus','ローカルサーバーに接続できません。下部の起動方法を確認してください。',true)}})();
</script></body></html>
